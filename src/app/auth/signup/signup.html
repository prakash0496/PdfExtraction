<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="auth-header d-flex justify-content-center align-items-center" style="height: 150px;">
  <a href="javascript:void(0)">
    <img src="assets/samples/cmplogo.jpeg" alt="logo img" class="logo-img" />
  </a>
</div>

      <div class="card my-5 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h3 class="mb-0"><b>Sign up</b></h3>
            <a routerLink="/login" class="link-primary">Already have an account?</a>
          </div>

          <form (ngSubmit)="onSignup()" #signupForm="ngForm">
            <div class="row">
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label class="form-label" for="firstName">First Name*</label>
                  <input
                    type="text"
                    class="form-control"
                    id="firstName"
                    placeholder="First Name"
                    name="firstName"
                    [(ngModel)]="firstname"
                    required
                  />
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label class="form-label" for="lastname">Last Name*</label>
                  <input
                    type="text"
                    class="form-control"
                    id="lastName"
                    placeholder="Last Name"
                    name="lastName"
                    [(ngModel)]="lastname"
                    required
                  />
                </div>
              </div>
            </div>

            <div class="form-group mb-3">
              <label class="form-label" for="company">Company</label>
              <input
                type="text"
                class="form-control"
                id="company"
                placeholder="Company"
                name="company"
                [(ngModel)]="company"
              />
            </div>

            <div class="form-group mb-3">
              <label class="form-label" for="emailAddress">Email Address*</label>
              <input
                type="email"
                class="form-control"
                id="emailAddress"
                placeholder="Email Address"
                name="emailAddress"
                [(ngModel)]="email_ids"
                required
              />
            </div>

            <div class="form-group mb-3">
              <label class="form-label" for="password">UserName</label>
              <input
                type="username"
                class="form-control"
                id="username"
                placeholder="UserName"
                name="username"
                [(ngModel)]="username"
                required
              />
            </div>

            <div class="form-group mb-3">
              <label class="form-label" for="password">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Password"
                name="password"
                [(ngModel)]="password"
                required
              />
            </div>

            <p class="mt-4 text-sm text-muted">
              By signing up, you agree to our
              <a href="javascript:void(0)" class="text-primary">Terms of Service</a>
              and
              <a href="javascript:void(0)" class="text-primary">Privacy Policy</a>.
            </p>

            <div class="d-grid mt-3">
              <button type="submit" class="btn btn-primary">Create Account</button>
            </div>
          </form>

          <!-- <div class="saprator mt-4 text-center">
            <span>Sign up with</span>
          </div> -->

                  </button>
                </div>
              </div>
            </ng-container>
          </div> -->
        </div>
      </div>
    </div>
  </div>
</div>
