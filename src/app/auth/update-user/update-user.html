<div class="container py-4">

  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 col-sm-12">

      <div class="card shadow-lg border-0 rounded-4">
        
        <div class="card-header bg-primary text-white text-center rounded-top-4">
          <h5 class="mb-0">Update User</h5>
        </div>

        <div class="card-body p-4" *ngIf="data">

          <form #userForm="ngForm">

            <div class="row g-3">

              <div class="col-md-6">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control"
                  [(ngModel)]="data.firstname" name="firstname">
              </div>

              <div class="col-md-6">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control"
                  [(ngModel)]="data.lastname" name="lastname">
              </div>

              <div class="col-12">
                <label class="form-label">Company</label>
                <input type="text" class="form-control"
                  [(ngModel)]="data.company" name="company">
              </div>

              <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control"
                  [(ngModel)]="data.phonenumber" name="phonenumber">
              </div>

              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="text" class="form-control"
                  [(ngModel)]="data.email_ids" name="email_ids">
              </div>

              <div class="col-12">
                <label class="form-label">Serial Number</label>
                <input type="text" class="form-control"
                  [(ngModel)]="data.serialNumber" name="serialNumber">
              </div>

            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center rounded-top-4">
  
  <button class="btn btn-light btn-sm" (click)="goBack()">
    ← Back
  </button>

  <h5 class="mb-0 mx-auto">Update User</h5>

  <div style="width: 60px;"></div> <!-- for spacing -->

</div>

            </div>

          </form>

        </div>

      </div>

    </div>
  </div>

</div>
