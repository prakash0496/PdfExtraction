<div class="container mt-5">
  <h2 class="text-center mb-3">Login</h2>
  <div class="card p-4 shadow-sm mx-auto" style="max-width: 400px;">
    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label>Username</label>
        <input [(ngModel)]="username" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Password</label>
        <input [(ngModel)]="password" name="password" type="password" class="form-control" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
      <div class="text-center mt-3">
  <button type="button" class="btn btn-link text-primary" (click)="onSignUp()">Create new account</button>
</div>

    </form>
  </div>
</div>
