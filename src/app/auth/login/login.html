<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<div class="container mt-5">
  <h2 class="text-center mb-3">Login</h2>

  <div class="card p-4 shadow-sm mx-auto" style="max-width: 400px;">


<form (ngSubmit)="onLogin()">

  <div class="mb-3">
    <label>Username</label>
    <input [(ngModel)]="username" name="username" class="form-control" required>
  </div>

  <div class="mb-3">
    <label>Password</label>

    <div class="input-group">
      <input
        [(ngModel)]="password"
        name="password"
        [type]="showPassword ? 'text' : 'password'"
        class="form-control"
        required>

      <span class="input-group-text"
            (click)="togglePassword()"
            style="cursor:pointer">

        <i class="fa"
           [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'">
        </i>

      </span>
    </div>
  </div>

  <div class="mb-3">
    <label>Upload License File</label>
    <input type="file" class="form-control" (change)="onFileSelected($event)" required>
  </div>

  <button class="btn btn-primary w-100" type="submit">
    Login
  </button>

  <div class="text-center mt-3">
    <button type="button"
            class="btn btn-link text-primary"
            (click)="onSignUp()">
      Create new account
    </button>
  </div>

</form>


  </div>
</div>
